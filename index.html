<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Obsidia — Automation for long-term rental management</title>
<meta name="description" content="Obsidia answers applicants, screens files, books viewings, handles incidents and issues rent receipts. Plug it into your property software and let the platform take the first level." />
<meta property="og:title" content="Obsidia — The agency that never re-keys anything" />
<meta property="og:description" content="Automation for long-term rental management. Six modules covering the rental cycle end to end." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #08090B; color: #F5F3EF; font-family: "Schibsted Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #C6A15B; text-decoration: none; }
  a:hover { color: #E2C692; }
  ::selection { background: #6E5A31; color: #F5F3EF; }
  @keyframes obsPulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  * { box-sizing: border-box; }
  /* hover states (ported from the design's style-hover attributes) */
  .obs-cta:hover { background: #E2C692 !important; }
  .obs-outline:hover { border-color: #C6A15B !important; color: #E2C692 !important; }
  .obs-card:hover { border-color: #6A7280 !important; }
  .obs-faq-btn:hover { color: #E2C692 !important; }
  input[type="range"] { accent-color: #C6A15B; }
</style>
</head>
<body>

<div style="background:#08090B;color:#F5F3EF;font-family:'Schibsted Grotesk',system-ui,sans-serif;overflow-x:hidden">

  <header style="position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:rgba(8,9,11,0.82);border-bottom:1px solid #272C35">

        <a href="#modules" style="color:#868C97;font-size:14px" data-t="navModules"></a>
        <a href="#qualification" style="color:#868C97;font-size:14px" data-t="navQualif"></a>
        <a href="#incidents" style="color:#868C97;font-size:14px" data-t="navIncidents"></a>
        <a href="#pricing" style="color:#868C97;font-size:14px" data-t="navPricing"></a>
        <a href="#faq" style="color:#868C97;font-size:14px">FAQ</a>

      </div>
      <a class="obs-app obs-cta" target="_blank" rel="noopener" style="background:#C6A15B;color:#08090B;font-size:14px;font-weight:600;padding:10px 18px;border-radius:8px;white-space:nowrap" data-t="ctaShort"></a>

  <section id="top" style="position:relative;padding:96px 24px 72px;border-bottom:1px solid #272C35">

          <span data-t="badge"></span>

        <h1 id="obs-h1" style="font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(44px,5.6vw,76px);line-height:1.02;letter-spacing:-0.015em;margin:26px 0 0"></h1>
        <p style="margin:24px 0 0;max-width:520px;font-size:17px;line-height:1.65;color:#868C97;text-wrap:pretty" data-t="heroSub"></p>
        <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:32px">
          <a class="obs-app obs-cta" target="_blank" rel="noopener" style="background:#C6A15B;color:#08090B;font-size:15px;font-weight:600;padding:14px 24px;border-radius:9px" data-t="ctaLong"></a>
          <a class="obs-outline" href="#modules" style="border:1px solid #6A7280;color:#F5F3EF;font-size:15px;font-weight:500;padding:14px 24px;border-radius:9px" data-t="ctaModules"></a>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:28px;margin-top:36px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6A7280;letter-spacing:.04em">
          <span data-t="heroKpi1"></span>
          <span>24/7</span>
          <span data-t="heroKpi3"></span>
        </div>
      </div>

      <div style="background:#14171D;border:1px solid #272C35;border-radius:16px;padding:20px;box-shadow:0 40px 80px -40px rgba(0,0,0,0.9)">

          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6FD8C4" data-t="inboxMeta"></span>

          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6A7280" data-t="inboxFoot1"></span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#C6A15B" data-t="inboxFoot2"></span>
        </div>
      </div>
    </div>
  </section>

  <section style="padding:28px 24px;border-bottom:1px solid #272C35;background:#08090B">

        <span style="font-size:14px;color:#868C97">ICS</span>
        <span style="font-size:14px;color:#868C97">Netty</span>
        <span style="font-size:14px;color:#868C97">Roland Palace</span>

  </section>

  <section id="modules" style="padding:88px 24px;border-bottom:1px solid #272C35">

      <div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#C6A15B;letter-spacing:.14em" data-t="qualEyebrow"></div>
        <h2 style="font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(30px,3.6vw,46px);line-height:1.1;margin:16px 0 0" data-t="qualTitle"></h2>
        <p style="margin:18px 0 0;color:#868C97;font-size:16px;line-height:1.65;max-width:520px" data-t="qualSub"></p>
        <div id="obs-qualchips" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:26px"></div>
      </div>

      <div style="background:#14171D;border:1px solid #272C35;border-radius:16px;padding:26px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
          <span style="font-size:13px;font-weight:600" data-t="simTitle"></span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6A7280">REF-2049-B</span>
        </div>
        <div style="margin-top:22px;display:flex;flex-direction:column;gap:22px">
          <div>
            <div style="display:flex;justify-content:space-between;font-size:12px;color:#868C97;gap:12px"><span data-t="simIncome"></span><span id="sim-revenus" style="font-family:'IBM Plex Mono',monospace;color:#F5F3EF"></span></div>
            <input id="sim-revenus-range" type="range" min="1200" max="8000" step="50" value="3200" style="width:100%;margin-top:10px;accent-color:#C6A15B" />
          </div>
          <div>
            <div style="display:flex;justify-content:space-between;font-size:12px;color:#868C97;gap:12px"><span data-t="simRent"></span><span id="sim-loyer" style="font-family:'IBM Plex Mono',monospace;color:#F5F3EF"></span></div>
            <input id="sim-loyer-range" type="range" min="400" max="3000" step="10" value="980" style="width:100%;margin-top:10px;accent-color:#C6A15B" />

        </div>
        <div style="margin-top:24px;border-top:1px solid #272C35;padding-top:20px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap">
          <div>
            <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6A7280;letter-spacing:.08em" data-t="simRatio"></div>
            <div id="sim-taux" style="font-family:'IBM Plex Mono',monospace;font-size:42px;line-height:1.1;color:#F5F3EF"></div>

            <div style="display:inline-flex;align-items:center;gap:8px;border:1px solid #272C35;background:#08090B;border-radius:8px;padding:8px 12px;font-size:12px;color:#F5F3EF">

            </div>
            <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6A7280;margin-top:8px" data-t="simThreshold"></div>
          </div>
        </div>
        <div style="margin-top:18px;height:6px;border-radius:999px;background:#08090B;overflow:hidden">
          <div id="sim-gauge" style="height:100%;border-radius:999px;background:#6FD8C4;width:0%"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="incidents" style="padding:88px 24px;border-bottom:1px solid #272C35">
    <div style="max-width:1180px;margin:0 auto">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#C6A15B;letter-spacing:.14em" data-t="incEyebrow"></div>
      <h2 style="font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(30px,3.6vw,46px);line-height:1.1;margin:16px 0 0;max-width:720px" data-t="incTitle"></h2>
      <div id="obs-timeline" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;margin-top:44px;background:#272C35;border:1px solid #272C35;border-radius:14px;overflow:hidden"></div>
    </div>
  </section>

  <section id="comparaison" style="padding:88px 24px;border-bottom:1px solid #272C35;background:#08090B">
    <div style="max-width:1180px;margin:0 auto">
      <h2 style="font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(30px,3.6vw,46px);line-height:1.1;margin:0;max-width:680px" data-t="cmpTitle"></h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:40px">
        <div style="border:1px solid #272C35;border-radius:14px;padding:28px">
          <div style="font-size:13px;font-weight:600;color:#868C97" data-t="cmpWithout"></div>
          <ul id="obs-cmp-without" style="margin:18px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px"></ul>
        </div>
        <div style="border:1px solid #C6A15B;border-radius:14px;padding:28px;background:linear-gradient(180deg, rgba(198,161,91,0.08), rgba(198,161,91,0))">
          <div style="font-size:13px;font-weight:600;color:#E2C692" data-t="cmpWith"></div>
          <ul id="obs-cmp-with" style="margin:18px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px"></ul>
        </div>
      </div>
    </div>
  </section>

  <section id="pricing" style="padding:88px 24px;border-bottom:1px solid #272C35">
    <div style="max-width:1180px;margin:0 auto">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#C6A15B;letter-spacing:.14em" data-t="priceEyebrow"></div>
      <h2 style="font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(30px,3.6vw,46px);line-height:1.1;margin:16px 0 0;max-width:720px" data-t="priceTitle"></h2>
      <p style="margin:18px 0 0;max-width:600px;color:#868C97;font-size:16px;line-height:1.6" data-t="priceSub"></p>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-top:44px;align-items:stretch">
        <div style="border:1px solid #C6A15B;border-radius:16px;padding:32px;background:linear-gradient(180deg, rgba(198,161,91,0.09), rgba(198,161,91,0));display:flex;flex-direction:column">
          <div style="display:flex;align-items:baseline;gap:10px">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:56px;line-height:1;color:#F5F3EF" data-t="priceBig"></span>
            <span style="font-size:14px;color:#E2C692" data-t="priceUnit"></span>
          </div>
          <p style="margin:16px 0 0;color:#868C97;font-size:14px;line-height:1.6" data-t="priceNote"></p>
          <ul id="obs-price-included" style="margin:24px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;flex:1"></ul>
          <a class="obs-app obs-cta" target="_blank" rel="noopener" style="margin-top:28px;display:block;text-align:center;background:#C6A15B;color:#08090B;font-size:15px;font-weight:600;padding:14px 24px;border-radius:9px" data-t="ctaLong"></a>
        </div>

        <div style="background:#14171D;border:1px solid #272C35;border-radius:16px;padding:32px;display:flex;flex-direction:column">
          <div style="font-size:13px;font-weight:600" data-t="calcTitle"></div>
          <div style="margin-top:26px">
            <div style="display:flex;justify-content:space-between;font-size:12px;color:#868C97;gap:12px"><span data-t="calcLots"></span><span id="calc-lots" style="font-family:'IBM Plex Mono',monospace;color:#F5F3EF"></span></div>
            <input id="calc-lots-range" type="range" min="10" max="1000" step="10" value="120" style="width:100%;margin-top:10px;accent-color:#C6A15B" />
          </div>
          <div style="margin-top:28px;border-top:1px solid #272C35;padding-top:24px;display:flex;flex-direction:column;gap:14px;flex:1">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
              <span style="font-size:13px;color:#868C97" data-t="calcMonthly"></span>
              <span id="calc-monthly" style="font-family:'IBM Plex Mono',monospace;font-size:32px;color:#C6A15B"></span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
              <span style="font-size:13px;color:#868C97" data-t="calcYearly"></span>
              <span id="calc-yearly" style="font-family:'IBM Plex Mono',monospace;font-size:16px;color:#F5F3EF"></span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
              <span style="font-size:13px;color:#868C97" data-t="calcPerLot"></span>
              <span style="font-family:'IBM Plex Mono',monospace;font-size:16px;color:#F5F3EF" data-t="priceExact"></span>
            </div>
          </div>
          <p style="margin:24px 0 0;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6A7280;line-height:1.6" data-t="calcFoot"></p>
        </div>
      </div>
    </div>
  </section>

  <section style="padding:88px 24px;border-bottom:1px solid #272C35;background:#08090B">
    <div id="obs-stats" style="max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px"></div>
  </section>

  <section id="faq" style="padding:88px 24px;border-bottom:1px solid #272C35">
    <div style="max-width:880px;margin:0 auto">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#C6A15B;letter-spacing:.14em">[ FAQ ]</div>
      <h2 style="font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(30px,3.6vw,46px);line-height:1.1;margin:16px 0 36px" data-t="faqTitle"></h2>
      <div id="obs-faq" style="border-top:1px solid #272C35"></div>
    </div>
  </section>

  <section style="padding:110px 24px;position:relative;overflow:hidden">
    <div style="position:absolute;inset:0;background:radial-gradient(700px 320px at 50% 120%, rgba(198,161,91,0.18), transparent 70%)"></div>
    <div style="position:relative;max-width:780px;margin:0 auto;text-align:center">
      <h2 style="font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(34px,4.6vw,60px);line-height:1.05;margin:0" data-t="finalTitle"></h2>
      <p style="margin:20px auto 0;max-width:520px;color:#868C97;font-size:16px;line-height:1.65" data-t="finalSub"></p>
      <div style="display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:32px">
        <a class="obs-app obs-cta" target="_blank" rel="noopener" style="background:#C6A15B;color:#08090B;font-size:15px;font-weight:600;padding:15px 28px;border-radius:9px" data-t="ctaLong"></a>
        <a class="obs-outline" href="#pricing" style="border:1px solid #6A7280;color:#F5F3EF;font-size:15px;font-weight:500;padding:15px 28px;border-radius:9px" data-t="ctaPricing"></a>
      </div>
    </div>
  </section>

  <footer style="border-top:1px solid #272C35;padding:36px 24px">
    <div style="max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="width:20px;height:20px;display:block;background:#C6A15B;clip-path:polygon(28% 0,100% 0,100% 72%,72% 100%,0 100%,0 28%)"></span>
        <span style="font-size:13px;font-weight:600;letter-spacing:.24em">OBSIDIA</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6A7280" data-t="tagline"></span>
      </div>
      <div style="display:flex;gap:22px;font-size:13px">
        <a href="#modules" style="color:#868C97" data-t="navModules"></a>
        <a href="#pricing" style="color:#868C97" data-t="navPricing"></a>
        <a class="obs-app" target="_blank" rel="noopener" style="color:#C6A15B" data-t="navApp"></a>
      </div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6A7280">© 2026 Obsidia</div>
    </div>
  </footer>
</div>

<script>
// ============================================================================
// Obsidia landing — standalone implementation of the CMH/DC "design code".
// The original relied on a proprietary runtime (support.js); this reproduces
// its DCLogic component (bilingual copy, simulators, FAQ) in vanilla JS.
// ============================================================================

// --- configuration (was <script> data-props on the source) -----------------
var APP_URL = "https://obsidia.base44.app";
var DEFAULT_LANG = "en";
var SHOW_COMPARISON = true;

// --- translations (verbatim from the source) --------------------------------
var COPY = {
  en: {
    navModules: "Modules", navQualif: "Screening", navIncidents: "Incidents", navPricing: "Pricing", navApp: "App",
    ctaShort: "Open the app", ctaLong: "Open the application", ctaModules: "See the 6 modules", ctaPricing: "See pricing",
    badge: "Automation for long-term rental management",
    h1a: "Your managed portfolio", h1b: "runs itself.",
    heroSub: "Obsidia answers applicants, screens files, books viewings, handles incidents and issues rent receipts. Your team stops re-keying data — it arbitrates.",
    heroKpi1: "100% of first-level requests", heroKpi3: "Connected to your property software",
    inboxTitle: "Unified inbox", inboxMeta: "● 4 handled by AI",

var state = { lang: DEFAULT_LANG, open: 0 };

// --- helpers ----------------------------------------------------------------
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function fmtMoney(n, lang) {
  var loc = lang === "fr" ? "fr-FR" : "en-GB";
  return new Intl.NumberFormat(loc, { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n);
}
function fmtNum(n, lang) {
  var loc = lang === "fr" ? "fr-FR" : "en-GB";
  return new Intl.NumberFormat(loc).format(n);
}
function $(sel) { return document.querySelector(sel); }

// --- element refs -----------------------------------------------------------
var elRev = $("#sim-revenus-range"), elLoyer = $("#sim-loyer-range"), elLots = $("#calc-lots-range");

// --- rendering --------------------------------------------------------------
function fillText(t) {
  document.querySelectorAll("[data-t]").forEach(function (el) {
    el.textContent = t[el.getAttribute("data-t")];
  });
  $("#obs-h1").innerHTML = esc(t.h1a) + "<br />" + esc(t.h1b);
  document.documentElement.lang = state.lang;
}

function buildLists(t) {
  // Inbox
  $("#obs-inbox").innerHTML = t.inbox.map(function (r, i) {
    var bg = i === 0 ? "#08090B" : "transparent";
    return '<div style="display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;padding:13px 10px;border-radius:9px;background:' + bg + '">' +
      '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;color:#6A7280;letter-spacing:.08em">' + esc(r[0]) + '</span>' +
      '<span style="font-size:13px;color:#F5F3EF">' + esc(r[1]) + '</span>' +

  $("#obs-modules").innerHTML = t.modules.map(function (m) {

      '<div style="font-size:15px;font-weight:600;margin-top:10px">' + esc(s[2]) + '</div>' +

  $("#obs-cmp-with").innerHTML = t.with.map(function (x) {

      '<p style="margin:0;padding:0 40px 24px 0;color:#868C97;font-size:15px;line-height:1.65">' + esc(f[1]) + '</p>' +

function updateFaqOpen() {
  document.querySelectorAll("[data-faq-item]").forEach(function (item) {
    var i = +item.getAttribute("data-faq-item");
    var opened = state.open === i;

    item.querySelector("[data-faq-panel]").style.maxHeight = opened ? "340px" : "0px";

}

function updateSim() {
  var lang = state.lang, t = COPY[lang];
  var revenus = +elRev.value, loyer = +elLoyer.value;
  var taux = (loyer / revenus) * 100;
  var ok = taux <= 33, mid = taux > 33 && taux <= 36;
  var color = ok ? "#6FD8C4" : (mid ? "#C6A15B" : "#F0766A");
  $("#sim-revenus").textContent = fmtMoney(revenus, lang);
  $("#sim-loyer").textContent = fmtMoney(loyer, lang);
  $("#sim-taux").textContent = taux.toFixed(1).replace(".", lang === "fr" ? "," : ".") + " %";
  $("#sim-status-dot").style.background = color;
  $("#sim-status-label").textContent = ok ? t.ok : (mid ? t.mid : t.ko);
  var gauge = $("#sim-gauge");
  gauge.style.background = color;
  gauge.style.width = Math.min(100, taux * 2) + "%";
}

function updateCalc() {
  var lang = state.lang;
  var lots = +elLots.value, monthly = lots * 10;
  $("#calc-lots").textContent = fmtNum(lots, lang);
  $("#calc-monthly").textContent = fmtMoney(monthly, lang) + (lang === "fr" ? " / mois" : " / mo");
  $("#calc-yearly").textContent = fmtMoney(monthly * 12, lang);
}

function updateLangButtons() {
  var en = $("#lang-en"), fr = $("#lang-fr");
  en.style.background = state.lang === "en" ? "#C6A15B" : "transparent";
  en.style.color = state.lang === "en" ? "#08090B" : "#868C97";
  fr.style.background = state.lang === "fr" ? "#C6A15B" : "transparent";
  fr.style.color = state.lang === "fr" ? "#08090B" : "#868C97";
}

function applyLang(lang) {
  state.lang = lang;
  try { localStorage.setItem("obsidia.lang", lang); } catch (e) {}
  var t = COPY[lang] || COPY.en;
  fillText(t);
  buildLists(t);
  updateSim();
  updateCalc();
  updateLangButtons();
}

// --- init -------------------------------------------------------------------
(function init() {
  // app links
  document.querySelectorAll(".obs-app").forEach(function (a) { a.setAttribute("href", APP_URL); });
  // comparison toggle
  if (!SHOW_COMPARISON) { var cmp = $("#comparaison"); if (cmp) cmp.style.display = "none"; }
  // saved language
  var saved = null;
  try { saved = localStorage.getItem("obsidia.lang"); } catch (e) {}
  state.lang = (saved === "fr" || saved === "en") ? saved : DEFAULT_LANG;
  // wire controls
  $("#lang-en").addEventListener("click", function () { applyLang("en"); });
  $("#lang-fr").addEventListener("click", function () { applyLang("fr"); });
  elRev.addEventListener("input", updateSim);
  elLoyer.addEventListener("input", updateSim);
  elLots.addEventListener("input", updateCalc);
  $("#obs-faq").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-faq]");
    if (!btn) return;
    var i = +btn.getAttribute("data-faq");
    state.open = state.open === i ? -1 : i;
    updateFaqOpen();
  });
  // first paint
  applyLang(state.lang);
})();
</script>
</body>
</html>
