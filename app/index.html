<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Obsidia — Demo</title>
<meta name="description" content="Obsidia demo: the AI agent that answers calls and messages, rates applicants, fills the CRM and handles tenants." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#F5F3EF" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='28,0 100,0 100,72 72,100 0,100 0,28' fill='%23C6A15B'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" rel="stylesheet" />
<script>
  try { if (localStorage.getItem("obsidia.theme") === "dark") document.documentElement.removeAttribute("data-theme"); } catch (e) {}
</script>
<link rel="stylesheet" href="app.css" />
</head>
<body>

  <symbol id="i-rank" viewBox="0 0 24 24"><path d="M4 6.5h9M4 12h6.5M4 17.5h4"/><path d="M17.5 18V6m-3 3 3-3 3 3"/></symbol>

  <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9 8.5h6M9 12.5h6"/></symbol>

  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>

<div class="shell">
  <aside class="side">
    <a class="logo" href="#/today" aria-label="Obsidia, today"><span class="logo-mark" aria-hidden="true"></span><span class="logo-word">Obsidia</span></a>
    <nav class="nav" aria-label="Main" id="nav">
      <a href="#/today" data-r="today"><svg class="i"><use href="#i-today"/></svg>Today</a>
      <a href="#/inbox" data-r="inbox"><svg class="i"><use href="#i-inbox"/></svg>Inbox<span class="count num" data-count="inbox"></span></a>
      <a href="#/applicants" data-r="applicants"><svg class="i"><use href="#i-rank"/></svg>Applicants<span class="count num" data-count="applicants"></span></a>
      <a href="#/crm" data-r="crm"><svg class="i"><use href="#i-db"/></svg>CRM<span class="count num" data-count="crm"></span></a>
      <a href="#/tenants" data-r="tenants"><svg class="i"><use href="#i-people"/></svg>Tenants<span class="count num" data-count="tenants"></span></a>
      <a href="#/properties" data-r="properties"><svg class="i"><use href="#i-home"/></svg>Properties<span class="count num" data-count="properties"></span></a>
      <a href="#/assistant" data-r="assistant"><svg class="i"><use href="#i-ask"/></svg>Assistant</a>
    </nav>
    <div class="side-foot">
      <div class="agency"><b id="agencyName">Demo agency</b><span id="agencyMeta">5 properties</span></div>
      <div class="side-actions">
        <a class="btn btn-ghost btn-sm" href="../"><svg class="i"><use href="#i-out"/></svg>Website</a>
        <button class="icon-btn theme-toggle" type="button" data-theme-toggle aria-label="Switch theme"><svg class="i i-moon"><use href="#i-moon"/></svg><svg class="i i-sun"><use href="#i-sun"/></svg></button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <a class="logo" href="#/today" aria-label="Obsidia, today"><span class="logo-mark" aria-hidden="true"></span><span class="logo-word">Obsidia</span></a>
      <p class="crumb" id="crumb"></p>
      <div class="top-right">
        <span class="demo-note demo-label"><i></i>Demo data</span>
        <button class="icon-btn sound-btn" type="button" id="soundBtn" aria-pressed="true" aria-label="Mute the voices" hidden><svg class="i i-sound"><use href="#i-sound"/></svg><svg class="i i-mute"><use href="#i-mute"/></svg></button>
        <div class="demo">
          <button class="btn btn-secondary btn-sm" type="button" id="demoBtn" aria-expanded="false" aria-controls="demoMenu"><svg class="i"><use href="#i-play"/></svg>Run demo</button>
          <div class="menu" id="demoMenu" role="menu"></div>
        </div>
        <button class="icon-btn theme-toggle show-sm" type="button" data-theme-toggle aria-label="Switch theme"><svg class="i i-moon"><use href="#i-moon"/></svg><svg class="i i-sun"><use href="#i-sun"/></svg></button>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<nav class="tabbar" aria-label="Main" id="tabbar">
  <a href="#/today" data-r="today"><svg class="i"><use href="#i-today"/></svg>Today</a>
  <a href="#/inbox" data-r="inbox"><svg class="i"><use href="#i-inbox"/></svg>Inbox</a>
  <a href="#/applicants" data-r="applicants"><svg class="i"><use href="#i-rank"/></svg>Files</a>
  <a href="#/crm" data-r="crm"><svg class="i"><use href="#i-db"/></svg>CRM</a>
  <a href="#/tenants" data-r="tenants"><svg class="i"><use href="#i-people"/></svg>Tenants</a>
  <a href="#/properties" data-r="properties"><svg class="i"><use href="#i-home"/></svg>Flats</a>
  <a href="#/assistant" data-r="assistant"><svg class="i"><use href="#i-ask"/></svg>Ask</a>
</nav>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true" tabindex="-1"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
